[project]
name = "firra-relay"
version = "0.0.0"
description = "Firra MCP relay: public /m/<link> endpoint to the Mac's outbound device link. Stores nothing."
requires-python = ">=3.12,<3.13"
dependencies = [
  "firra-contracts",
  "fastapi>=0.118",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.12",
  "cryptography>=45",
]

[tool.uv.sources]
firra-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "firra_relay"
module-root = ""
