# Planted scenarios with ground truth. `expect.signals` lists the signal types (P2 step 9) that
# must fire for the client as of `as_of` (for churned clients: before churned_at); an empty list
# means none may fire (false-positive control).
scenarios:
  - key: brightpath_delivery_risk
    client: brightpath
    description: Repeated delivery delays, a quality complaint and an escalation by the VP to the founder.
    expect:
      signals: [delivery_complaint, repeated_complaint, executive_escalation, tone_decline, late_commitment]
      assessment: {risk: high, expansion: none, play: fix_first}
      advise: fix_first
    threads:
      - subject: Weekly paid media report
        messages:
          - at: 2026-09-04T15:10:00Z
            sender: dana.cole
            to: [ana.ruiz]
            brief: Chases the weekly paid media report that has not arrived yet; short and clearly annoyed.
            include:
              - The weekly report still hasn't arrived and we needed it for Monday's pipeline review.
              - We also haven't received any response to our last two emails.
            expect:
              - {kind: complaint, subtype: delay, quote: "The weekly report still hasn't arrived and we needed it for Monday's pipeline review."}
              - {kind: complaint, subtype: communication, quote: "We also haven't received any response to our last two emails."}
              - {kind: tone, tone: negative, quote: "The weekly report still hasn't arrived and we needed it for Monday's pipeline review."}
          - at: 2026-09-04T18:30:00Z
            sender: ana.ruiz
            to: [dana.cole]
            brief: Apologizes for the delay and promises the complete report.
            include:
              - You will have the full report by Friday, September 11.
            expect:
              - {kind: commitment, owner_side: firm, due_date: 2026-09-11, quote: "You will have the full report by Friday, September 11."}
      - subject: Paid social creatives
        messages:
          - at: 2026-09-15T13:05:00Z
            sender: dana.cole
            to: [ana.ruiz]
            cc: [ben.okafor]
            brief: Says the report is late again and that the team is losing patience; asks for a call.
            include:
              - This is the third week in a row the report has arrived late.
              - Honestly, the team is getting frustrated with how this account is being handled.
            expect:
              - {kind: complaint, subtype: delay, quote: "This is the third week in a row the report has arrived late."}
              - {kind: tone, tone: negative, quote: "Honestly, the team is getting frustrated with how this account is being handled."}
          - at: 2026-09-15T17:20:00Z
            sender: ana.ruiz
            to: [dana.cole]
            cc: [ben.okafor]
            brief: Apologizes and proposes two times for a call tomorrow.
          - at: 2026-09-16T08:45:00Z
            sender: dana.cole
            to: [ana.ruiz]
            cc: [ben.okafor]
            brief: Short, matter-of-fact reply picking one of the proposed times.
      - subject: Northbeam engagement
        messages:
          - at: 2026-09-22T16:40:00Z
            sender: victor.hale
            to: [dan.mercer]
            cc: [dana.cole]
            brief: The VP Marketing writes to the agency founder to escalate the delays and a targeting mistake.
            include:
              - I'm escalating this because the delays are now affecting our board reporting.
              - The LinkedIn targeting went to the wrong job titles for two weeks.
            expect:
              - {kind: complaint, subtype: delay, quote: "I'm escalating this because the delays are now affecting our board reporting."}
              - {kind: complaint, subtype: quality, quote: "The LinkedIn targeting went to the wrong job titles for two weeks."}
              - {kind: tone, tone: negative, quote: "I'm escalating this because the delays are now affecting our board reporting."}
          - at: 2026-09-23T09:15:00Z
            sender: dan.mercer
            to: [victor.hale]
            cc: [dana.cole, ana.ruiz]
            brief: The founder acknowledges the problems without excuses and promises a recovery plan.
            include:
              - I will personally review the account and send you a recovery plan by September 25.
            expect:
              - {kind: commitment, owner_side: firm, due_date: 2026-09-25, quote: "I will personally review the account and send you a recovery plan by September 25."}

