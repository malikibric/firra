# Multichannel signal oracle (L2S-10): cases for signals.v3 from the spec only.
# Written from docs/plans/local/multichannel-signals.md §7 (O1–O15) plus derived
# boundary cases, independently of the L2S-09 implementation. The implementer must
# not edit expectations: a disagreement goes to the lead.
#
# Format extends oracle.yaml: ref is the same 2026-09-30T00:00:00Z; day/hour work
# as there, plus minute (default 0) for chat gaps. Records take source (email|chat,
# default email), channel (chat channel; thread key is "channel" or "channel/thread"),
# connection (a label from connections, for coverage). from is a client person id,
# "firm" (firm side, no author), "owner" (the owner author) or a firm person id
# (people entry with firm: true). owner/owners declare the owner ids; timezone sets
# ClientFacts.timezone. connections build CoverageFacts (id, status, synced_until day).
# expect/caveats/inputs/pending work as in oracle.yaml; caveat compares caveat codes
# from the coverage guard (assessment-level suppression lives there, not in drafts).
# why quotes the spec section each case checks.

