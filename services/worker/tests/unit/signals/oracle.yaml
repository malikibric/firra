# Signal oracle (T07): executable form of the rule catalog in the original task spec.
# Written from the catalog only, independently of the implementation; the implementer must not edit
# expectations — a disagreement is raised with the lead, and either the catalog or the rule changes.
#
# Format
#   ref: 2026-09-30T00:00:00Z for every case. Records and events are timestamps ref + day days + hour
#   hours (hour defaults to 12, so `day: -30` is inside "within 30 d"; use `hour: 0` for the exact
#   boundary). Date fields (contract_start, renewal_date, departed, first_seen, due) are the date
#   ref + day. For a churned client the runner sets churned_at = ref.
#   client:      status (active|churned|prospect), policy (full|metadata_only), contract_start (day),
#                renewal_date (day), notice_period_days
#   people:      client-side people: id, name, decision_maker, champion, departed (day), first_seen (day)
#   records:     id, day, hour, thread, from (person id | firm), processed (default true),
#                items: [{kind, subtype, tone, change, person, text, evidence}] — `evidence` labels
#                a verified quote on this record
#   extra_records: appended to records (lets cases share a YAML anchor of baseline records)
#   commitments: id, side (firm|client), due (day), status, evidence [labels]
#   events:      day, hour, status (scheduled|held|cancelled|rescheduled)
#   expect:      exactly the signals this rule produces: type, severity, basis, dedupe_key,
#                evidence (labels, compared as a set; [] for metadata). dedupe_key references:
#                "@person:<id>", "@record:<id>", "@commitment:<id>", "@date:<day>" (ISO date of ref+day)
#   inputs:      optional; when present, compared key by key (floats to 2 decimals)
#   pending:     optional note; the case is skipped until the named task lands (the implementer of
#                that task deletes only this line)
# P2b additions (the design notes):
#   events[].attendees       attendee_count of the event
#   items[].budget_direction grow|cut|renewal|neutral; items[].initiative_type
#   needs:       id, service (label or null), status (open|addressed|dismissed), last_seen (day),
#                mentions, evidence [labels]; dedupe reference "@need:<id>"
#   A thread is "started by the client" when its earliest record is a client message; a client
#   reply is a client message whose immediately preceding record in its thread is the firm's.
# Only the rule under test runs for a case.

tone_decline:
  - name: half of six recent client messages are negative against a clean baseline
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -2, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e1}]}
      - {id: r2, day: -5, thread: t2, from: dana}
      - {id: r3, day: -8, thread: t3, from: dana, items: [{kind: tone, tone: negative, evidence: e2}]}
      - {id: r4, day: -12, thread: t4, from: dana}
      - {id: r5, day: -18, thread: t5, from: dana, items: [{kind: tone, tone: negative, evidence: e3}]}
      - {id: r6, day: -25, thread: t6, from: dana}
      - {id: b1, day: -40, thread: t7, from: dana}
      - {id: b2, day: -70, thread: t8, from: dana}
      - {id: b3, day: -100, thread: t9, from: dana}
    expect:
      - {type: tone_decline, severity: high, basis: evidence, dedupe_key: tone, evidence: [e1, e2, e3]}
    inputs: {share_30: 0.5, share_base: 0.0, messages_30: 6}

  - name: exactly 30 percent fires at medium when there is no baseline window
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -1, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e1}]}
      - {id: r2, day: -3, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e2}]}
      - {id: r3, day: -5, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e3}]}
      - {id: r4, day: -7, thread: t1, from: dana}
      - {id: r5, day: -9, thread: t1, from: dana}
      - {id: r6, day: -11, thread: t1, from: dana}
      - {id: r7, day: -13, thread: t1, from: dana}
      - {id: r8, day: -15, thread: t1, from: dana}
      - {id: r9, day: -17, thread: t1, from: dana}
      - {id: r10, day: -19, thread: t1, from: dana}
    expect:
      - {type: tone_decline, severity: medium, basis: evidence, dedupe_key: tone, evidence: [e1, e2, e3]}

  - name: four processed messages are below the minimum
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -1, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e1}]}
      - {id: r2, day: -3, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e2}]}
      - {id: r3, day: -5, thread: t1, from: dana}
      - {id: r4, day: -7, thread: t1, from: dana}
      - {id: r5, day: -9, thread: t1, from: dana, processed: false}
    expect: []

  - name: a message exactly 30 days old belongs to the baseline, leaving four recent ones
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -1, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e1}]}
      - {id: r2, day: -3, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e2}]}
      - {id: r3, day: -5, thread: t1, from: dana}
      - {id: r4, day: -7, thread: t1, from: dana}
      - {id: r5, day: -30, hour: 0, thread: t1, from: dana}
    expect: []

  - name: two of seven is below 30 percent
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -1, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e1}]}
      - {id: r2, day: -3, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e2}]}
      - {id: r3, day: -5, thread: t1, from: dana}
      - {id: r4, day: -7, thread: t1, from: dana}
      - {id: r5, day: -9, thread: t1, from: dana}
      - {id: r6, day: -11, thread: t1, from: dana}
      - {id: r7, day: -13, thread: t1, from: dana}
    expect: []

  - name: an account that was already this negative has no decline
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -1, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e1}]}
      - {id: r2, day: -3, thread: t1, from: dana, items: [{kind: tone, tone: negative, evidence: e2}]}
      - {id: r3, day: -5, thread: t1, from: dana}
      - {id: r4, day: -7, thread: t1, from: dana}
      - {id: r5, day: -9, thread: t1, from: dana}
      - {id: b1, day: -40, thread: t2, from: dana, items: [{kind: tone, tone: negative, evidence: e3}]}
      - {id: b2, day: -50, thread: t2, from: dana}
      - {id: b3, day: -60, thread: t2, from: dana}
      - {id: b4, day: -70, thread: t2, from: dana}
    expect: []

  - name: firm messages and positive tone do not count as negative
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -1, thread: t1, from: dana, items: [{kind: tone, tone: positive, evidence: e1}]}
      - {id: r2, day: -2, thread: t1, from: firm}
      - {id: r3, day: -3, thread: t1, from: dana}
      - {id: r4, day: -5, thread: t1, from: dana}
      - {id: r5, day: -7, thread: t1, from: dana}
      - {id: r6, day: -9, thread: t1, from: dana}
    expect: []

