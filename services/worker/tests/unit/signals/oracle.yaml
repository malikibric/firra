      - {id: f5, day: -20, hour: 1, thread: e, from: firm}
      - {id: c5, day: -20, hour: 23, thread: e, from: maria}
    expect: []

  - name: without three baseline replies there is nothing to compare
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: maria, champion: true, first_seen: -400}]
    records:
      - {id: f1, day: -150, hour: 9, thread: a, from: firm}
      - {id: c1, day: -150, hour: 13, thread: a, from: maria}
