delivery_complaint:
  - name: one signal per subtype
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -3, thread: t1, from: dana, items: [{kind: complaint, subtype: delay, evidence: e1}]}
      - {id: r2, day: -10, thread: t2, from: dana, items: [{kind: complaint, subtype: quality, evidence: e2}]}
    expect:
      - {type: delivery_complaint, severity: medium, basis: evidence, dedupe_key: delay, evidence: [e1]}
      - {type: delivery_complaint, severity: medium, basis: evidence, dedupe_key: quality, evidence: [e2]}

  - name: two complaints of one subtype are high
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -3, thread: t1, from: dana, items: [{kind: complaint, subtype: communication, evidence: e1}]}
      - {id: r2, day: -20, thread: t2, from: dana, items: [{kind: complaint, subtype: communication, evidence: e2}]}
    expect:
      - {type: delivery_complaint, severity: high, basis: evidence, dedupe_key: communication, evidence: [e1, e2]}

  - name: subtype other, old complaints and firm-authored text do not count
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -3, thread: t1, from: dana, items: [{kind: complaint, subtype: other, evidence: e1}]}
      - {id: r2, day: -31, thread: t2, from: dana, items: [{kind: complaint, subtype: delay, evidence: e2}]}
      - {id: r3, day: -4, thread: t3, from: firm, items: [{kind: complaint, subtype: delay, evidence: e3}]}
    expect: []

repeated_complaint:
  - name: two complaints on two records within 60 days
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -5, thread: t1, from: dana, items: [{kind: complaint, subtype: delay, evidence: e1}]}
      - {id: r2, day: -50, thread: t2, from: dana, items: [{kind: complaint, subtype: other, evidence: e2}]}
    expect:
      - {type: repeated_complaint, severity: high, basis: evidence, dedupe_key: repeated, evidence: [e1, e2]}

  - name: two complaints in one message are not repeated
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -5, thread: t1, from: dana, items: [{kind: complaint, subtype: delay, evidence: e1}, {kind: complaint, subtype: quality, evidence: e2}]}
    expect: []

  - name: the second complaint is outside the window
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}]
    records:
      - {id: r1, day: -5, thread: t1, from: dana, items: [{kind: complaint, subtype: delay, evidence: e1}]}
      - {id: r2, day: -61, thread: t2, from: dana, items: [{kind: complaint, subtype: delay, evidence: e2}]}
    expect: []

executive_escalation:
  - name: a decision maker complains
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana}, {id: victor, decision_maker: true, first_seen: -300}]
    records:
      - {id: r1, day: -8, thread: t1, from: victor, items: [{kind: complaint, subtype: delay, evidence: e1}]}
    expect:
      - {type: executive_escalation, severity: high, basis: evidence, dedupe_key: escalation, evidence: [e1]}

  - name: a newly seen decision maker joins a complaint thread
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana, first_seen: -300}, {id: cfo, decision_maker: true, first_seen: -12}]
    records:
      - {id: r1, day: -8, thread: t1, from: dana, items: [{kind: complaint, subtype: quality, evidence: e1}]}
      - {id: r2, day: -6, thread: t1, from: cfo}
    expect:
      - {type: executive_escalation, severity: high, basis: evidence, dedupe_key: escalation, evidence: [e1]}

  - name: a long-known decision maker on the thread is not an escalation
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: dana, first_seen: -300}, {id: cfo, decision_maker: true, first_seen: -200}]
    records:
      - {id: r1, day: -8, thread: t1, from: dana, items: [{kind: complaint, subtype: quality, evidence: e1}]}
      - {id: r2, day: -6, thread: t1, from: cfo}
    expect: []

  - name: a decision maker's complaint older than 30 days
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: victor, decision_maker: true, first_seen: -300}]
    records:
      - {id: r1, day: -40, thread: t1, from: victor, items: [{kind: complaint, subtype: delay, evidence: e1}]}
    expect: []

champion_departure:
  - name: the champion left and a message says so
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: maria, name: Maria Santos, champion: true, departed: -40, first_seen: -400}]
    records:
      - {id: r1, day: -41, thread: t1, from: maria, items: [{kind: stakeholder_change, change: left, person: Maria Santos, evidence: e1}]}
    expect:
      - {type: champion_departure, severity: high, basis: evidence, dedupe_key: "@person:maria", evidence: [e1]}

  - name: without a quote the departure is metadata
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: maria, name: Maria Santos, champion: true, departed: -40, first_seen: -400}]
    records: []
    expect:
      - {type: champion_departure, severity: high, basis: metadata, dedupe_key: "@person:maria", evidence: []}

  - name: old departures and non-champions do not fire
    client: {status: active, policy: full, contract_start: -500}
    people:
      - {id: maria, name: Maria Santos, champion: true, departed: -100, first_seen: -400}
      - {id: tom, name: Tom Reyes, departed: -10, first_seen: -400}
    records: []
    expect: []

champion_latency_drift:
  - name: champion replies slow from hours to days
    client: {status: active, policy: full, contract_start: -500}
    people: [{id: maria, champion: true, first_seen: -400}]
    records:
      - {id: f1, day: -150, hour: 9, thread: a, from: firm}
      - {id: c1, day: -150, hour: 13, thread: a, from: maria}
      - {id: f2, day: -120, hour: 9, thread: b, from: firm}
      - {id: c2, day: -120, hour: 14, thread: b, from: maria}
      - {id: f3, day: -100, hour: 9, thread: c, from: firm}
      - {id: c3, day: -100, hour: 15, thread: c, from: maria}
      - {id: f4, day: -40, hour: 9, thread: d, from: firm}
      - {id: c4, day: -37, hour: 7, thread: d, from: maria}
      - {id: f5, day: -20, hour: 9, thread: e, from: firm}
      - {id: c5, day: -16, hour: 3, thread: e, from: maria}
    expect:
      - {type: champion_latency_drift, severity: medium, basis: metadata, dedupe_key: "@person:maria", evidence: []}
    inputs: {recent_median_h: 80.0, base_median_h: 5.0, recent_n: 2, base_n: 3}

  - name: one slow reply is not a drift
    client: {status: active, policy: full, contract_start: -500}
